<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dribbling Admin</title><style>body{font-family:Arial;padding:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px}</style></head><body><h1>Admin Panel</h1><button onclick="load()">Обновить</button><h2>Пользователи</h2><table id="users"></table><h2>Матчи</h2><table id="matches"></table><script>
const api=localStorage.getItem('api')||'http://localhost:8000';
async function load(){const [u,m]=await Promise.all([fetch(api+'/admin/users').then(r=>r.json()),fetch(api+'/admin/matches').then(r=>r.json())]);document.getElementById('users').innerHTML='<tr><th>ID</th><th>Username</th><th>Blocked</th></tr>'+u.map(x=>`<tr><td>${x.telegram_id}</td><td>${x.username||''}</td><td>${x.is_blocked}</td></tr>`).join('');document.getElementById('matches').innerHTML='<tr><th>Title</th><th>City</th><th>Status</th></tr>'+m.map(x=>`<tr><td>${x.title}</td><td>${x.city}</td><td>${x.status}</td></tr>`).join('')}
load();
</script></body></html>
